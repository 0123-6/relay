name: Star history

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/star-history.yml'
      - 'scripts/update-star-history.py'

permissions:
  contents: write

concurrency:
  group: star-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Collect star count and draw charts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-star-history.py
      - name: Save updated records and charts
        env:
          STAR_HISTORY_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/star-history.json assets/star-history.svg assets/star-history-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: update star history'
          git push origin "HEAD:$STAR_HISTORY_BRANCH"
